<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0D6A5B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Projet V8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Projet V8</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: app shell. Sticky header with grade ladder, one 760px column, fixed bottom tab bar, timer sheet over everything. */
:root{
  --bg:#ECEFED; --surface:#FFFFFF; --sunk:#E2E7E4; --ink:#17201D; --muted:#56645F; --line:#D2D9D5;
  --accent:#0D6A5B; --accent-ink:#FFFFFF; --accent-soft:#D3E9E3;
  --p1:#5B7C47; --p2a:#0D6A5B; --p2b:#9E6410; --p3:#9E3D29;
  --warn:#9E6410; --warn-soft:#F4E6CC; --danger:#9E3D29; --danger-soft:#F3DBD5;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px; --nav-h:62px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101614; --surface:#18201E; --sunk:#202A27; --ink:#E4EBE8; --muted:#97A6A1; --line:#2C3834;
  --accent:#3CB49C; --accent-ink:#06120F; --accent-soft:#16352E;
  --p1:#93B47C; --p2a:#3CB49C; --p2b:#DDA144; --p3:#E0785F;
  --warn:#DDA144; --warn-soft:#33270F; --danger:#E0785F; --danger-soft:#3A1E17; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#101614; --surface:#18201E; --sunk:#202A27; --ink:#E4EBE8; --muted:#97A6A1; --line:#2C3834;
  --accent:#3CB49C; --accent-ink:#06120F; --accent-soft:#16352E;
  --p1:#93B47C; --p2a:#3CB49C; --p2b:#DDA144; --p3:#E0785F;
  --warn:#DDA144; --warn-soft:#33270F; --danger:#E0785F; --danger-soft:#3A1E17; color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);font-weight:700;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-size:30px;text-transform:uppercase}
h3{font-size:24px}
h4{font-size:18px;text-transform:uppercase;letter-spacing:.04em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:baseline;gap:6px}
.brand b{color:var(--accent)}
.ladder{display:flex;gap:3px;margin-left:auto;align-items:center}
.ladder span{font-family:var(--display);font-weight:600;font-size:13px;padding:2px 7px;border-radius:4px;background:var(--sunk);color:var(--muted)}
.ladder span.on{background:var(--accent);color:var(--accent-ink)}
.ladder span.goal{outline:1.5px dashed var(--accent);outline-offset:-1.5px;background:transparent;color:var(--accent)}
.sync{font-size:11px;color:var(--muted);width:100%;display:flex;justify-content:space-between}

main{padding-block:18px calc(var(--nav-h) + 90px + env(safe-area-inset-bottom,0px))}
.view{display:grid;gap:18px}
.view>*{min-width:0}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card.flat{background:transparent;border:none;padding:0}
.stack{display:grid;gap:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--ink);white-space:nowrap}
.chip.ph{background:color-mix(in srgb,var(--ph) 16%,transparent);color:var(--ph)}
.chip.ok{background:var(--accent-soft);color:var(--accent)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ph,var(--accent));display:inline-block}

/* Hero (today) */
.hero{display:grid;gap:12px}
.hero h2{font-size:38px}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.stat .v{font-family:var(--display);font-weight:700;font-size:28px;line-height:1}
.stat .l{font-size:11.5px;color:var(--muted);margin-top:3px}

/* Week strip */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.strip button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 2px 8px;display:grid;justify-items:center;gap:2px;position:relative}
.strip button .d{font-size:11px;color:var(--muted);font-weight:600}
.strip button .t{font-family:var(--display);font-weight:700;font-size:15px}
.strip button.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.strip button.today .d{color:var(--accent)}
.strip button .s{width:6px;height:6px;border-radius:50%;background:transparent}
.strip button.done .s{background:var(--accent)}
.strip button.rest .t{color:var(--muted)}

/* Day */
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.day-head{padding:16px 16px 12px;border-top:5px solid var(--ph);display:grid;gap:8px}
.day-head h3{font-size:27px}
.day-body{padding:0 16px 16px;display:grid;gap:14px}
.banner{border-radius:8px;padding:10px 12px;font-size:14px;background:var(--warn-soft);color:var(--ink);border-left:3px solid var(--warn)}
.banner.info{background:var(--accent-soft);border-left-color:var(--accent)}
.block{border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;gap:8px}
.block .bh{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.block ul,.block ol,.steps{margin:0;padding-left:20px;display:grid;gap:6px}
.block li::marker{color:var(--ph,var(--accent))}
details.fold{border:1px solid var(--line);border-radius:8px;background:var(--bg)}
details.fold>summary{list-style:none;cursor:pointer;padding:10px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center;font-weight:600}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"+";font-family:var(--mono);color:var(--muted)}
details.fold[open]>summary::after{content:"−"}
details.fold>.inner{padding:0 14px 14px;display:grid;gap:10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;font-size:14px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ghost{background:transparent}
.btn.timer::before{content:"";width:9px;height:9px;border:2px solid currentColor;border-radius:50%;display:inline-block;margin-right:7px;vertical-align:-1px}
.donebox{border-top:1px dashed var(--line);padding-top:14px;display:grid;gap:10px}
.donebox label{font-size:13px;color:var(--muted);display:grid;gap:4px}
.donebox input[type=text]{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.rpe-row{display:flex;gap:10px;align-items:center}
.rpe-row input{flex:1;accent-color:var(--accent)}
.rpe-row output{font-family:var(--display);font-weight:700;font-size:22px;width:2.2em;text-align:right}

/* Tables */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--sunk);white-space:nowrap}
tr:last-child td{border-bottom:none}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}

/* Plan: week grid */
.weeks{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:3px}
.weeks button{border:none;border-radius:5px;padding:8px 0 6px;background:color-mix(in srgb,var(--ph) 18%,var(--surface));color:var(--ink);font-family:var(--display);font-weight:700;font-size:14px;display:grid;justify-items:center;gap:3px}
.weeks button.deload{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--ph) 18%,var(--surface)) 0 4px,var(--surface) 4px 8px)}
.weeks button.sel{background:var(--ph);color:var(--surface)}
.weeks button.cur{box-shadow:inset 0 0 0 2px var(--ink)}
.weeks button i{display:block;width:70%;height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.weeks button i b{display:block;height:100%;background:var(--ink)}
.weeks button.sel i{background:color-mix(in srgb,var(--surface) 40%,transparent)}
.weeks button.sel i b{background:var(--surface)}
.phase-legend{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin-top:6px}
.phase-legend div{font-size:11px;color:var(--ph);font-weight:600;border-top:2px solid var(--ph);padding-top:4px}
@media (max-width:520px){.weeks{grid-template-columns:repeat(8,minmax(0,1fr))}.phase-legend{grid-template-columns:repeat(2,1fr)}}

.dayrow>summary .l{display:flex;gap:10px;align-items:center;min-width:0}
.dayrow>summary .l span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dayrow>summary .dw{font-family:var(--display);font-weight:700;width:38px;flex:none;text-transform:uppercase}
.dayrow>.inner{padding:0}
.dayrow .day{border:none;border-radius:0}

/* Exercise cards */
.ex{display:grid;gap:10px}
.ex .exh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.ex .big{font-family:var(--mono);font-size:15px;color:var(--accent)}
.ex .cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ex .cols>div{min-width:0}
@media (max-width:560px){.ex .cols{grid-template-columns:1fr}}
.ex h5{margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.ex ul,.ex ol{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14px}
.phasegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.phasegrid div{border-top:3px solid var(--ph);background:var(--bg);border-radius:0 0 6px 6px;padding:6px 8px;font-size:12.5px}
.phasegrid div b{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ph)}
.phasegrid div.cur{background:color-mix(in srgb,var(--ph) 14%,var(--surface))}
@media (max-width:520px){.phasegrid{grid-template-columns:repeat(2,1fr)}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two>*{min-width:0}
@media (max-width:560px){.two{grid-template-columns:1fr}}
.list-do li::marker{content:"+  ";color:var(--accent);font-weight:700}
.list-no li::marker{content:"×  ";color:var(--danger);font-weight:700}

/* Segmented */
.seg{display:flex;background:var(--sunk);border-radius:9px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;border:none;background:transparent;padding:7px 8px;border-radius:7px;font-weight:600;font-size:13px;min-width:90px}
.seg button.on{background:var(--surface);box-shadow:0 1px 2px rgb(0 0 0/.12)}

/* Macro */
.macros{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.macro .v{font-family:var(--display);font-weight:700;font-size:26px;line-height:1}
.macro .l{font-size:12px;color:var(--muted)}
@media (max-width:480px){.macros{grid-template-columns:repeat(2,1fr)}}
.timeline{display:grid;gap:0}
.timeline .tl{display:grid;grid-template-columns:56px 1fr auto;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:baseline}
.timeline .tl:last-child{border-bottom:none}
.timeline .tl .h{font-family:var(--mono);font-size:13px;color:var(--muted)}
.timeline .tl .p{font-family:var(--mono);font-size:13px;color:var(--accent);white-space:nowrap}

/* Protein tracker */
.pt-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pt-head .v{font-family:var(--display);font-size:40px;font-weight:700;line-height:1}
.pt-bar{height:12px;border-radius:99px;background:var(--sunk);position:relative;overflow:hidden}
.pt-bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:99px}
.pt-bar u{position:absolute;top:0;bottom:0;border-left:2px solid var(--ink);opacity:.5}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.quick button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 11px;font-size:13px}
.quick button b{font-family:var(--mono);font-weight:500;color:var(--accent);margin-left:4px}
.eaten{display:flex;flex-wrap:wrap;gap:6px}
.eaten button{border:none;background:var(--accent-soft);color:var(--ink);border-radius:6px;padding:3px 8px;font-size:12.5px}
.eaten button::after{content:" ×";color:var(--muted)}

/* Progress */
.tests input,.tests select{font:inherit;font-family:var(--mono);font-size:13px;width:74px;padding:5px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.tests select{width:auto}
.tests td:first-child{min-width:150px}
.chart svg{width:100%;height:auto;display:block}
.charts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.charts>*{min-width:0}
@media (max-width:640px){.charts{grid-template-columns:1fr}}
.hist{display:grid;gap:0}
.hist div{display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:baseline}
.hist div:last-child{border-bottom:none}
.field{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.field input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px}

/* Bottom nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(6,1fr);padding-inline:4px}
.tabs button{border:none;background:none;padding:8px 0 7px;display:grid;justify-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);height:var(--nav-h)}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--accent)}
.fab{position:fixed;right:max(16px,calc((100vw - 760px)/2 + 16px));bottom:calc(var(--nav-h) + 14px + env(safe-area-inset-bottom,0px));z-index:31;border:none;border-radius:999px;background:var(--ink);color:var(--bg);padding:11px 18px;font-weight:600;font-size:14px;box-shadow:0 4px 14px rgb(0 0 0/.22);display:flex;gap:8px;align-items:center}
.fab::before{content:"";width:10px;height:10px;border:2px solid currentColor;border-radius:50%}
.fab.live{background:var(--accent);color:var(--accent-ink)}

/* Timer sheet */
.sheet{position:fixed;inset:0;z-index:50;background:rgb(0 0 0/.45);display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--surface);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;max-height:92vh;overflow:auto}
.clock{border-radius:12px;padding:20px 12px;text-align:center;background:var(--sunk);transition:background .3s}
.clock[data-phase=work]{background:var(--danger);color:#fff}
.clock[data-phase=ready]{background:var(--warn);color:#fff}
.clock[data-phase=rest]{background:var(--accent);color:var(--accent-ink)}
.clock .ph{font-family:var(--display);font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:.1em}
.clock .t{font-family:var(--display);font-size:96px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.clock .s{font-size:14px;opacity:.85}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.presets button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;font-size:13px;text-align:left}
.presets button.on{border-color:var(--accent);background:var(--accent-soft)}
.custom{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.custom input{width:100%}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand">Projet <b>V8</b></div>
    <div class="ladder" id="ladder" aria-label="Échelle de niveau"></div>
    <div class="sync"><span id="syncState">Chargement…</span><span id="planDates"></span></div>
  </div>
</header>

<main class="wrap" id="app"></main>

<button class="fab" id="fab" type="button">Minuteur</button>

<nav class="tabs" aria-label="Sections">
  <div class="wrap" id="tabs">
    <button data-tab="today" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Aujourd’hui</button>
    <button data-tab="plan" type="button"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Plan</button>
    <button data-tab="warm" type="button"><svg viewBox="0 0 24 24"><path d="M12 3c1 3 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3-1-3 0-6 1-8.5z"/></svg>Échauff.</button>
    <button data-tab="gym" type="button"><svg viewBox="0 0 24 24"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Salle</button>
    <button data-tab="food" type="button"><svg viewBox="0 0 24 24"><path d="M3 11h18a9 9 0 0 1-18 0zM8 7c0-2 2-2 2-4M13 7c0-2 2-2 2-4"/></svg>Nutrition</button>
    <button data-tab="track" type="button"><svg viewBox="0 0 24 24"><path d="M3 20h18M6 16l4-5 3 3 5-7"/></svg>Suivi</button>
  </div>
</nav>

<div class="sheet" id="sheet" hidden>
  <div class="panel" role="dialog" aria-label="Minuteur">
    <div class="row" style="justify-content:space-between">
      <h3>Minuteur</h3>
      <button class="btn sm ghost" id="sheetClose" type="button">Fermer</button>
    </div>
    <div class="clock" id="clock" data-phase="idle">
      <div class="ph" id="clkPh">Prêt</div>
      <div class="t" id="clkT">0:10</div>
      <div class="s" id="clkS">Série 1 / 6</div>
    </div>
    <div class="row">
      <button class="btn pri" id="tStart" type="button" style="flex:1">Démarrer</button>
      <button class="btn" id="tReset" type="button">Réinitialiser</button>
    </div>
    <div class="presets" id="presets"></div>
    <div class="custom">
      <label class="field">Séries<input id="tSets" type="number" min="1" max="30" inputmode="numeric"></label>
      <label class="field">Effort (s)<input id="tWork" type="number" min="0" max="600" inputmode="numeric"></label>
      <label class="field">Repos (s)<input id="tRest" type="number" min="0" max="900" inputmode="numeric"></label>
    </div>
    <p class="muted" style="font-size:13px">5 s de préparation avant chaque suspension, bips sur les 3 dernières secondes. Le son démarre après ton premier appui sur Démarrer.</p>
  </div>
</div>

<script>

/* ================= HELPERS ================= */
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function pd(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function today0(){const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())}
function iso(dt){return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0")}
function idxToday(){return Math.round((today0()-pd(state.start))/864e5)}
function wd(idx){return {w:Math.floor(idx/7)+1,d:((idx%7)+7)%7}}
function dateOf(w,d){const dt=pd(state.start);dt.setDate(dt.getDate()+(w-1)*7+d);return dt}
const fmtD=dt=>dt.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
const fmtS=dt=>dt.toLocaleDateString("fr-FR",{day:"numeric",month:"short"});
function curWeek(){const i=idxToday();return Math.min(16,Math.max(1,wd(i).w))}

function getDay(w,d){
 const ph=phaseOf(w);
 let day=DAYS[ph.id].find(x=>x.dow===d&&(!x.weeks||x.weeks.includes(w)));
 if(TESTW.includes(w)&&d===5)day=TESTDAY;
 day=Object.assign({},day);
 day.blocks=(day.blocks||[]).filter(b=>!b.weeks||b.weeks.includes(w));
 day.banners=[];
 if(DELOAD.includes(w)&&day.type!=="rest"&&day.type!=="test")day.banners.push(w===16?"Semaine de décharge : RPE 6 maximum, moitié du volume, aucun effort limite.":"Semaine de décharge : moitié du volume, RPE 7 maximum, pas de bloc limite. C’est là que ton corps encaisse le travail.");
 if(w===15&&d===0)day.banners.push("Semaine de croix : seulement 3 séries de suspensions, puis 45 min de projet.");
 if(w===15&&d===3)day.banners.push("Semaine de croix : 30 min faciles seulement, garde tout pour samedi.");
 if(w===15&&d===5)day.banners.push("C’est le samedi pour lequel tu t’entraînes depuis 15 semaines. Tout pour la croix sur ton projet le plus dur.");
 if(w===4&&d===5)day.banners.push("Fin de la Phase 1 : premier relevé de tes chiffres.");
 return day;
}
const TYPE={climb:"Grimpe",gym:"Salle",rest:"Repos",test:"Tests"};
const isTraining=day=>day.type!=="rest";
function totalSessions(){let n=0;for(let w=1;w<=16;w++)for(let d=0;d<7;d++)if(isTraining(getDay(w,d)))n++;return n}
function doneCount(){return Object.keys(state.done).length}
function dueSoFar(){const i=idxToday();let n=0;for(let w=1;w<=16;w++)for(let d=0;d<7;d++){const k=(w-1)*7+d;if(k<i&&isTraining(getDay(w,d)))n++}return n}
function doneOfWeek(w){let n=0,t=0;for(let d=0;d<7;d++){if(isTraining(getDay(w,d))){t++;if(state.done[`w${w}d${d}`])n++}}return [n,t]}

 <details class="fold"><summary>Échelle d’effort (RPE)</summary><div class="inner"><div class="tbl"><table><thead><tr><th>RPE</th><th>Sensation</th><th>Pour</th></tr></thead><tbody>
 <tr><td class="n">3-4</td><td>Tu peux discuter, aucune congestion</td><td>Échauffements, retour au calme, mobilité</td></tr>
 <tr><td class="n">5-6</td><td>Concentré, tu pourrais en faire beaucoup plus</td><td>Volume technique, décharges</td></tr>
 <tr><td class="n">7-8</td><td>Dur, 2 à 3 reps ou mouvements en réserve</td><td>Salle, suspensions, board</td></tr>
 <tr><td class="n">9-10</td><td>Tout ce que tu as</td><td>Bloc limite et projets uniquement</td></tr></tbody></table></div></div></details>

 <li>Douleur au coude interne qui dure jusqu’au lendemain : plus de board pendant une semaine, garde les curls inversés.</li>

 <details class="fold"><summary>Course à pied et ultra</summary><div class="inner"><ul class="steps">
 <li><b>Phase 1 :</b> sortie longue le dimanche (jusqu’à 90 min), footing facile le mercredi.</li>
 <li><b>Phases 2A et 2B :</b> la sortie longue passe au mercredi. Rien le dimanche pour arriver frais lundi.</li>
 <li><b>Phase 3 :</b> 60 min max le mercredi, pour protéger le samedi.</li>
 <li>Toujours en endurance fondamentale (respiration nasale). Pas de fractionné ni de tempo pendant le cycle.</li>
 <li>Une course de plus de 60 min = journée à ~3 000 kcal (voir Nutrition).</li></ul></div></details>
 <details class="fold"><summary>Grimper à Singapour</summary><div class="inner"><ul class="steps">
 <li>L’humidité tue l’adhérence : grimpe tôt le matin ou après 19 h, magnésie liquide sous la magnésie sèche, une serviette.</li>
 <li>Tu transpires plus qu’à Paris : 500 à 750 ml d’eau par heure de grimpe, électrolytes les jours chauds.</li>
 <li>Peau : ponce les callosités deux fois par semaine et mets un baume le soir. Un bout de doigt fendu = une semaine perdue.</li></ul></div></details>
 <details class="fold"><summary>Correspondance V / Fontainebleau</summary><div class="inner"><div class="tbl"><table><thead><tr><th>V</th>${Object.keys(FONT).map(k=>`<th>${k}</th>`).join("")}</tr></thead><tbody><tr><td><b>Font</b></td>${Object.values(FONT).map(v=>`<td class="n">${v}</td>`).join("")}</tr></tbody></table></div><p class="muted" style="font-size:13px">Correspondance approximative. Le board se cote en général 1 à 2 niveaux plus dur.</p></div></details>
 <details class="fold"><summary>Après la semaine 16</summary><div class="inner"><p>Refais le cycle à partir de la Phase 2A (semaines 5 à 16 = un bloc de 12 semaines) avec des charges plus lourdes. Tous les deux cycles, une semaine complète sans grimper pour laisser les tendons s’adapter. Deux à trois cycles : le chemin réaliste vers le V8.</p></div></details>
 </section></div>`;
 return h;
}

function chartSVG(t){
 const vals=TW.map(w=>{const v=parseFloat(String((state.tests[t.id]||{})[w]??"").replace(",","."));return isNaN(v)?null:v});
 const pts=vals.map((v,i)=>v===null?null:[i,v]).filter(Boolean);
 const W=300,H=150,pl=34,pr=10,pt=12,pb=26;
 let lo,hi;const all=pts.map(p=>p[1]).concat(t.band||[]);
 if(t.id==="bw"){all.push(58,61)}
 if(!all.length){lo=0;hi=10}else{lo=Math.min(...all);hi=Math.max(...all)}
 if(hi-lo<4){const m=(hi+lo)/2;lo=m-2;hi=m+2}
 const pad=(hi-lo)*.1;lo=Math.floor(lo-pad);hi=Math.ceil(hi+pad);
 const X=i=>pl+i*(W-pl-pr)/4,Y=v=>pt+(hi-v)/(hi-lo)*(H-pt-pb);
 const ticks=[lo,Math.round((lo+hi)/2),hi];
 let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t.n)}">`;
 const band=t.band||(t.id==="bw"?[58,61]:null);
 if(band)s+=`<rect x="${pl}" y="${Y(band[1])}" width="${W-pl-pr}" height="${Y(band[0])-Y(band[1])}" fill="var(--accent-soft)"/>`;
 ticks.forEach(v=>{s+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${v}</text>`});
 TW.forEach((w,i)=>s+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">S${w}</text>`);
 if(pts.length>1)s+=`<polyline points="${pts.map(p=>X(p[0])+","+Y(p[1])).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>`;
 pts.forEach((p,i)=>{const last=i===pts.length-1;s+=`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="${last?5:3.5}" fill="${last?"var(--accent)":"var(--surface)"}" stroke="var(--accent)" stroke-width="2"/>`;if(last)s+=`<text x="${X(p[0])}" y="${Y(p[1])-10}" text-anchor="middle" font-size="12" font-weight="600" fill="var(--ink)" font-family="IBM Plex Mono,monospace">${p[1]}</text>`});
 if(!pts.length)s+=`<text x="${(W+pl)/2}" y="${H/2}" text-anchor="middle" font-size="12" fill="var(--muted)">Pas encore de mesure</text>`;
 return s+`</svg>`;
}

 h+=`<section class="card stack"><h3>Réglages</h3><label class="field" for="startDate">Date de départ du plan (un lundi)<input type="date" id="startDate" value="${state.start}"></label><p class="muted" style="font-size:13px">Semaine 1 = la semaine de cette date. Le plan finit le ${fmtD(dateOf(16,6))}. Tes séances validées restent attachées à leur semaine du plan.</p></section></div>`;

 const s=state.tests.send||{};let cur="V4";TW.forEach(w=>{if(s[w])cur=s[w]});
 const L=["V4","V5","V6","V7","V8"];
 document.getElementById("ladder").innerHTML=L.map(g=>`<span class="${g===cur?"on":""} ${g==="V8"&&cur!=="V8"?"goal":""}" title="${g} ≈ ${FONT[g]}">${g}</span>`).join("");
 document.getElementById("planDates").textContent=`${fmtS(pd(state.start))} → ${fmtS(dateOf(16,6))}`;
}
function render(){
 const app=document.getElementById("app");
 const V={today:vToday,plan:vPlan,warm:vWarm,gym:vGym,food:vFood,track:vTrack}[ui.tab]||vToday;
 app.innerHTML=V();
 document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===ui.tab));
 ladder();
}
function go(tab,anchor){
 ui.tab=tab;try{localStorage.setItem("projetV8.tab",tab)}catch(e){}
 render();
 if(anchor){const el=document.getElementById(anchor);if(el){el.scrollIntoView({block:"start"});return}}
 window.scrollTo(0,0);
}

document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest("button[data-tab]");if(b){if(b.dataset.tab==="today")ui.dayOffset=0;go(b.dataset.tab)}});
document.getElementById("app").addEventListener("click",e=>{
 const t=e.target.closest("[data-done],[data-undo],[data-shift],[data-pick],[data-week],[data-timer],[data-goto],[data-addp],[data-rmp],[data-nut],[data-gymph],[data-export],[data-importshow],[data-import]");
 if(!t)return;
 if(t.hasAttribute("data-export")){const txt=JSON.stringify(state);const box=document.getElementById("bkBox"),ta=document.getElementById("bkText"),msg=document.getElementById("bkMsg");
  const fallback=()=>{box.hidden=false;ta.value=txt;ta.focus();ta.select();document.getElementById("bkImport").hidden=true;msg.textContent="Sélectionne le texte ci-dessus et copie-le."};
  try{navigator.clipboard.writeText(txt).then(()=>{msg.textContent="Sauvegarde copiée. Colle-la dans Importer sur ton autre appareil."},fallback)}catch(err){fallback()}return}
 if(t.hasAttribute("data-importshow")){const box=document.getElementById("bkBox");box.hidden=false;document.getElementById("bkImport").hidden=false;const ta=document.getElementById("bkText");ta.value="";ta.focus();document.getElementById("bkMsg").textContent="Colle ta sauvegarde, puis remplace.";return}
 if(t.hasAttribute("data-import")){const msg=document.getElementById("bkMsg");try{const d=JSON.parse(document.getElementById("bkText").value.trim());if(!d||!d.v||!d.done)throw 0;state=Object.assign(blank(),d);persist();render();const m=document.getElementById("bkMsg");if(m)m.textContent="Données importées."}catch(err){msg.textContent="Ce texte n’est pas une sauvegarde Projet V8. Recopie-la en entier depuis l’autre appareil."}return}
 if(t.dataset.goto){e.preventDefault();go(t.dataset.goto,t.dataset.ex?"ex-"+t.dataset.ex:null);return}
 if(t.dataset.done){const k=t.dataset.done;const r=document.getElementById("rpe-"+k),n=document.getElementById("note-"+k);state.done[k]={at:Date.now(),rpe:+(r?r.value:7),note:n?n.value.trim():""};persist();keepScroll(render);return}
 if(t.dataset.undo){delete state.done[t.dataset.undo];persist();keepScroll(render);return}
 if(t.dataset.shift!==undefined){const s=+t.dataset.shift;ui.dayOffset=s===0?0:ui.dayOffset+s;keepScroll(render);return}
 if(t.dataset.pick!==undefined){ui.dayOffset=+t.dataset.pick-idxToday();keepScroll(render);return}
 if(t.dataset.week){ui.planWeek=+t.dataset.week;keepScroll(render);return}
 if(t.dataset.timer){openTimer(t.dataset.timer);return}
 if(t.dataset.addp!==undefined){const q=QUICK[+t.dataset.addp];const k=iso(today0());(state.protein[k]=state.protein[k]||[]).push([q[0],q[1]]);prune();persist();keepScroll(render);return}
 if(t.dataset.rmp!==undefined){const k=iso(today0());(state.protein[k]||[]).splice(+t.dataset.rmp,1);persist();keepScroll(render);return}
 if(t.dataset.nut){ui.nut=t.dataset.nut;keepScroll(render);return}
 if(t.dataset.gymph){ui.gymPh=t.dataset.gymph;keepScroll(render);return}
});
document.getElementById("app").addEventListener("input",e=>{const o=e.target.dataset.rpeout;if(o)document.getElementById(o).textContent=e.target.value});
document.getElementById("app").addEventListener("change",e=>{
 const el=e.target;
 if(el.dataset.test){const tt=(state.tests[el.dataset.test]=state.tests[el.dataset.test]||{});const v=el.value.trim();if(v)tt[el.dataset.w]=v;else delete tt[el.dataset.w];persist();const c=document.getElementById("charts");if(c)c.innerHTML=chartsHTML();ladder();return}
 if(el.id==="startDate"&&/^\d{4}-\d{2}-\d{2}$/.test(el.value)){state.start=el.value;ui.dayOffset=0;ui.planWeek=null;persist();keepScroll(render)}
});
function keepScroll(fn){const y=window.scrollY;const open=[...document.querySelectorAll("#app details")].map(d=>d.open);fn();const ds=document.querySelectorAll("#app details");if(ds.length===open.length)ds.forEach((d,i)=>d.open=open[i]);window.scrollTo(0,y)}

/* ================= TIMER ================= */
const T={key:"max",sets:6,work:10,rest:180,phase:"idle",set:1,end:0,left:0,running:false,iv:null,lastBeep:-1};
let actx=null,wake=null;
function beep(f,d){try{if(!actx)return;const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.25,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);o.start();o.stop(actx.currentTime+d)}catch(e){}}
function fmtT(s){s=Math.max(0,Math.ceil(s));return s>=60?Math.floor(s/60)+":"+String(s%60).padStart(2,"0"):String(s)}
const PHN={idle:"Prêt",ready:"Prépare-toi",work:"Suspends",rest:"Repos",done:"Terminé"};
function paint(){
 const c=document.getElementById("clock");c.dataset.phase=T.phase;
 document.getElementById("clkPh").textContent=PHN[T.phase];
 const left=T.running?(T.end-Date.now())/1000:T.left;
 document.getElementById("clkT").textContent=T.phase==="idle"?fmtT(T.work||T.rest):T.phase==="done"?"✓":fmtT(left);
 document.getElementById("clkS").textContent=T.work?`Série ${T.set} / ${T.sets} · ${T.work} s effort · ${fmtT(T.rest)} repos`:`Compte à rebours ${fmtT(T.rest)}`;
 document.getElementById("tStart").textContent=T.running?"Pause":(T.phase==="idle"||T.phase==="done"?"Démarrer":"Reprendre");
 document.getElementById("fab").classList.toggle("live",T.running);
 document.getElementById("fab").textContent=T.running?`${PHN[T.phase]} ${fmtT(left)}`:"Minuteur";
}
function enter(ph,sec){T.phase=ph;T.end=Date.now()+sec*1000;T.lastBeep=-1;if(ph==="work")beep(1200,.35);if(ph==="rest"&&T.work)beep(500,.25)}
function tick(){
 if(!T.running)return;const left=(T.end-Date.now())/1000;
 const whole=Math.ceil(left);
 if((T.phase==="ready"||(T.phase==="rest"))&&whole<=3&&whole>0&&whole!==T.lastBeep){T.lastBeep=whole;beep(800,.12)}
 if(left<=0){
  if(T.phase==="ready")enter("work",T.work);
  else if(T.phase==="work"){if(T.set<T.sets)enter("rest",T.rest);else finish()}
  else if(T.phase==="rest"){if(!T.work||T.set>=T.sets){finish()}else{T.set++;enter("work",T.work)}}
 }
 paint();
}
function finish(){T.phase="done";T.running=false;clearInterval(T.iv);beep(1000,.2);setTimeout(()=>beep(1300,.4),250);releaseWake();paint()}
async function getWake(){try{if(navigator.wakeLock)wake=await navigator.wakeLock.request("screen")}catch(e){}}
function releaseWake(){try{wake&&wake.release();wake=null}catch(e){}}
function startPause(){
 try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();actx.resume&&actx.resume()}catch(e){}
 if(T.running){T.left=(T.end-Date.now())/1000;T.running=false;clearInterval(T.iv);releaseWake();paint();return}
 if(T.phase==="idle"||T.phase==="done"){T.set=1;T.running=true;if(T.work)enter("ready",5);else enter("rest",T.rest)}
 else{T.running=true;T.end=Date.now()+T.left*1000}
 clearInterval(T.iv);T.iv=setInterval(tick,100);getWake();paint();
}
function resetT(){T.running=false;clearInterval(T.iv);T.phase="idle";T.set=1;releaseWake();paint()}
function loadPreset(k){const p=TIMERS[k];T.key=k;T.sets=p.sets;T.work=p.work;T.rest=p.rest;syncInputs();resetT();renderPresets()}
function syncInputs(){document.getElementById("tSets").value=T.sets;document.getElementById("tWork").value=T.work;document.getElementById("tRest").value=T.rest}
function renderPresets(){document.getElementById("presets").innerHTML=Object.entries(TIMERS).map(([k,p])=>`<button type="button" data-preset="${k}" class="${k===T.key?"on":""}">${esc(p.n)}</button>`).join("")}
function openTimer(k){if(k&&!T.running)loadPreset(k);document.getElementById("sheet").hidden=false;paint()}
document.getElementById("fab").addEventListener("click",()=>openTimer(null));
document.getElementById("sheetClose").addEventListener("click",()=>document.getElementById("sheet").hidden=true);
document.getElementById("sheet").addEventListener("click",e=>{if(e.target.id==="sheet")e.target.hidden=true;const b=e.target.closest("[data-preset]");if(b)loadPreset(b.dataset.preset)});
document.getElementById("tStart").addEventListener("click",startPause);
document.getElementById("tReset").addEventListener("click",resetT);
["tSets","tWork","tRest"].forEach(id=>document.getElementById(id).addEventListener("change",e=>{const v=Math.max(0,parseInt(e.target.value)||0);if(id==="tSets")T.sets=Math.max(1,v);if(id==="tWork")T.work=v;if(id==="tRest")T.rest=v;T.key="custom";renderPresets();resetT()}));
document.addEventListener("keydown",e=>{if(e.key==="Escape")document.getElementById("sheet").hidden=true});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&T.running)getWake()});

/* ================= BOOT ================= */
loadPreset("max");
render();
setSync("Enregistré sur cet appareil");
initCloud();
</script>
